name: Auto Update Clean IPs

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时自动运行一次
  workflow_dispatch:        # 支持在网页上手动点“运行”按钮

jobs:
  update-ips:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest Clean IPs
        run: |
          # 自动抓取三网（电信CT、联通CU、移动CM）当日最新优选IP池
          curl -sSL "https://addressesapi.090227.xyz/CloudFlareYes" -o ip.txt
          echo "Updated ip.txt successfully:"
          cat ip.txt

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ip.txt
          git commit -m "Auto update best clean IPs: $(date '+%Y-%m-%d %H:%M:%S')" || exit 0
          git push
